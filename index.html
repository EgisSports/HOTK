<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game of Thrones: Hand of the King</title>

<style>
:root{
    --bg:#111827;
    --panel:#1f2937;
    --card:#374151;
    --text:#f9fafb;
    --accent:#fbbf24;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Segoe UI,Tahoma,sans-serif;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:15px;
}

#setup{
    text-align:center;
    margin-bottom:20px;
}

select,button{
    padding:10px;
    border:none;
    border-radius:6px;
    font-size:16px;
}

button{
    cursor:pointer;
    background:var(--accent);
    color:black;
    font-weight:bold;
}

#status{
    text-align:center;
    font-size:22px;
    margin-bottom:15px;
}

#game{
    display:none;
}

#board{
    display:grid;
    grid-template-columns: repeat(6,1fr);
    gap:6px;
    max-width:900px;
    margin:auto;
}

.card{
    min-height:90px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:5px;
    font-weight:bold;
    cursor:pointer;
    user-select:none;
    transition:.2s;
    border:3px solid transparent;
}

.card:hover{
    transform:scale(1.04);
}

.varys{
    border:3px solid gold;
}

.legal{
    box-shadow:0 0 12px #00ff88;
}

.empty{
    visibility:hidden;
}

.house-Stark{background:#2563eb;}
.house-Greyjoy{background:#f59e0b;}
.house-Lannister{background:#dc2626;}
.house-Targaryen{background:#7c3aed;}
.house-Baratheon{background:#16a34a;}
.house-Tyrell{background:#84cc16;}
.house-Tully{background:#0891b2;}
.house-Varys{background:#444;}

#players{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:10px;
    margin-top:20px;
}

.player{
    background:var(--panel);
    border-radius:10px;
    padding:10px;
}

.activePlayer{
    outline:3px solid gold;
}

.banner{
    display:inline-block;
    margin:2px;
    padding:4px 8px;
    border-radius:4px;
    background:black;
}

#log{
    max-width:900px;
    margin:15px auto;
    background:var(--panel);
    padding:10px;
    border-radius:10px;
    height:150px;
    overflow:auto;
}
</style>
</head>
<body>

<h1>Hand of the King</h1>

<div id="setup">
    Players:
    <select id="playerCount">
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
    </select>

    <button onclick="startGame()">Start Game</button>
</div>

<div id="game">

<div id="status"></div>

<div id="board"></div>

<div id="players"></div>

<div id="log"></div>

</div>

<script>

const houseCounts = {
    Stark:8,
    Greyjoy:7,
    Lannister:6,
    Targaryen:5,
    Baratheon:4,
    Tyrell:3,
    Tully:2
};

const bannerValue = {...houseCounts};

let board=[];
let players=[];
let currentPlayer=0;
let gameOver=false;

function log(msg){
    const div=document.getElementById("log");
    div.innerHTML=msg+"<br>"+div.innerHTML;
}

function shuffle(a){
    for(let i=a.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
    }
}

function startGame(){

    gameOver=false;

    players=[];

    const count=parseInt(document.getElementById("playerCount").value);

    for(let i=0;i<count;i++){
        players.push({
            name:`Player ${i+1}`,
            cards:{},
            banners:new Set()
        });
    }

    let deck=[];

    Object.entries(houseCounts).forEach(([house,count])=>{
        for(let i=0;i<count;i++){
            deck.push({
                house,
                id:`${house}-${i}`
            });
        }
    });

    deck.push({
        house:"Varys",
        id:"Varys"
    });

    shuffle(deck);

    board=deck;

    currentPlayer=0;

    document.getElementById("setup").style.display="none";
    document.getElementById("game").style.display="block";

    render();
}

function getVarysIndex(){
    return board.findIndex(c=>c && c.house==="Varys");
}

function render(){

    renderBoard();
    renderPlayers();

    document.getElementById("status").innerHTML=
        `${players[currentPlayer].name}'s Turn`;
}

function renderBoard(){

    const container=document.getElementById("board");

    container.innerHTML="";

    const legal=getLegalMoves();

    board.forEach((card,index)=>{

        const div=document.createElement("div");

        if(!card){
            div.className="card empty";
            container.appendChild(div);
            return;
        }

        div.className=`card house-${card.house}`;

        if(card.house==="Varys")
            div.classList.add("varys");

        if(legal.includes(index))
            div.classList.add("legal");

        div.innerHTML=card.house;

        div.onclick=()=>attemptMove(index);

        container.appendChild(div);
    });
}

function renderPlayers(){

    const container=document.getElementById("players");

    container.innerHTML="";

    players.forEach((p,i)=>{

        const div=document.createElement("div");

        div.className="player";

        if(i===currentPlayer)
            div.classList.add("activePlayer");

        let banners=[...p.banners]
            .map(b=>`<span class='banner'>${b}</span>`)
            .join("");

        div.innerHTML=
        `
        <h3>${p.name}</h3>
        <p>Banners: ${p.banners.size}</p>
        ${banners}
        `;

        container.appendChild(div);
    });
}

function getLegalMoves(){

    const legal=[];

    const v=getVarysIndex();

    const row=Math.floor(v/6);
    const col=v%6;

    const dirs=[
        [-1,0],
        [1,0],
        [0,-1],
        [0,1]
    ];

    dirs.forEach(([dr,dc])=>{

        let r=row+dr;
        let c=col+dc;

        while(r>=0 && r<6 && c>=0 && c<6){

            let idx=r*6+c;

            if(board[idx])
                legal.push(idx);

            r+=dr;
            c+=dc;
        }

    });

    return legal;
}

function attemptMove(target){

    if(gameOver) return;

    if(!getLegalMoves().includes(target))
        return;

    moveVarys(target);
}

function moveVarys(target){

    const v=getVarysIndex();

    const player=players[currentPlayer];

    const targetHouse=board[target].house;

    const path=[];

    if(Math.floor(v/6)===Math.floor(target/6)){

        const step=target>v?1:-1;

        for(let i=v+step;;i+=step){

            if(board[i] && board[i].house===targetHouse)
                path.push(i);

            if(i===target)
                break;
        }

    } else {

        const step=target>v?6:-6;

        for(let i=v+step;;i+=step){

            if(board[i] && board[i].house===targetHouse)
                path.push(i);

            if(i===target)
                break;
        }
    }

    path.forEach(idx=>{

        if(!board[idx]) return;

        player.cards[targetHouse]=(player.cards[targetHouse]||0)+1;

        board[idx]=null;
    });

    board[v]=null;
    board[target]={house:"Varys",id:"Varys"};

    updateBanners();

    log(`${player.name} collected ${path.length} ${targetHouse}`);

    if(checkEndGame()){
        finishGame();
        return;
    }

    currentPlayer=(currentPlayer+1)%players.length;

    render();
}

function updateBanners(){

    Object.keys(houseCounts).forEach(house=>{

        let max=-1;
        let leader=[];

        players.forEach((p,index)=>{

            const count=p.cards[house]||0;

            if(count>max){
                max=count;
                leader=[index];
            } else if(count===max){
                leader.push(index);
            }
        });

        players.forEach(p=>p.banners.delete(house));

        leader.forEach(i=>{
            if(max>0)
                players[i].banners.add(house);
        });
    });
}

function checkEndGame(){

    return getLegalMoves().length===0;
}

function finishGame(){

    gameOver=true;

    let winners=[];
    let best=-1;

    players.forEach((p,i)=>{

        const score=p.banners.size;

        if(score>best){
            best=score;
            winners=[i];
        }
        else if(score===best){
            winners.push(i);
        }
    });

    let winner=winners[0];

    if(winners.length>1){

        let strongest=-1;

        winners.forEach(i=>{

            players[i].banners.forEach(b=>{

                if(bannerValue[b]>strongest){

                    strongest=bannerValue[b];
                    winner=i;
                }
            });
        });
    }

    render();

    alert(
        `Game Over!\n\nWinner: ${players[winner].name}\nBanners: ${players[winner].banners.size}`
    );
}

</script>
</body>
</html>
